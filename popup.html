<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plastic</title>
  <style>
    body { width: 240px; font-family: sans-serif; padding: 10px; margin: 0; }
    button { width: 100%; padding: 8px; margin: 4px 0; cursor: pointer; font-weight: bold; }
    .status { font-size: 12px; color: #555; text-align: center; margin-top: 5px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 8px; margin: 8px 0; }
    legend { font-size: 12px; color: #555; padding: 0 4px; }
    .format-toggle { display: flex; gap: 4px; }
    .format-toggle label { flex: 1; }
    .format-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .format-toggle span { display: block; text-align: center; padding: 6px 0; border-radius: 6px; font-size: 13px; font-weight: 600; background: #f4f4f5; cursor: pointer; }
    .format-toggle input:checked + span { background: #7c3aed; color: white; }
    .format-toggle input:focus-visible + span { outline: 2px solid #7c3aed; outline-offset: 1px; }
    .format-hint { font-size: 11px; color: #71717a; margin: 4px 2px 0; }
  </style>
</head>
<body>
  <h3>Plastic</h3>
  <fieldset>
    <legend>Output style</legend>
    <div class="format-toggle" role="radiogroup" aria-label="Output style">
      <label><input type="radio" name="plastic-format" value="css" checked><span>CSS</span></label>
      <label><input type="radio" name="plastic-format" value="tailwind"><span>Tailwind</span></label>
    </div>
    <p class="format-hint">Tailwind pastes utility classes; the destination needs Tailwind.</p>
  </fieldset>
  <button id="copy-page">Copy Entire Page</button>
  <button id="copy-selection">Copy Selected Text</button>
  <button id="pick-element">Pick Element to Copy</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>

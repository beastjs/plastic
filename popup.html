<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plastic</title>
  <style>
    @font-face { font-family: "Plastic OKXS"; src: url("fonts/okxs-medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: "Plastic OKXS", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #edf5ff; }
    body { width: 360px; margin: 0; padding: 20px; background: radial-gradient(ellipse at 0% 0%, #29415c 0, transparent 55%), radial-gradient(ellipse at 100% 65%, #312554 0, transparent 55%), #090e1b; }
    .shell { position: relative; padding: 20px; overflow: hidden; border: 1px solid #ffffff26; border-radius: 24px; background: linear-gradient(145deg, #ffffff12, #ffffff04); box-shadow: inset 0 1px 0 #ffffff24, 0 20px 45px #00000040; backdrop-filter: blur(24px); }
    .shell::before { content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 1px; background: linear-gradient(90deg, transparent, #aff5ff, transparent); pointer-events: none; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 23px; }
    .mark { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid #b8eaff50; border-radius: 13px; background: linear-gradient(135deg, #9bebff30, #b295ff15); box-shadow: inset 0 1px 0 #ffffff38, 0 0 24px #7ccfff16; }
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    h3 { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.8px; }
    .subtitle { margin: 3px 0 0; font-size: 10px; letter-spacing: 1.7px; text-transform: uppercase; color: #a8bbd3; }
    .spark { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: #a1f2e6; box-shadow: 0 0 12px #a1f2e680; }
    fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
    legend { padding: 0; margin-bottom: 8px; font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: #a8bbd3; }
    .format-toggle { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; padding: 4px; border: 1px solid #ffffff10; border-radius: 12px; background: #050b184d; box-shadow: inset 0 2px 6px #00000020; }
    .format-toggle label { position: relative; min-width: 0; }
    .format-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .format-toggle span { display: block; text-align: center; padding: 9px 0; border: 1px solid transparent; border-radius: 8px; font-size: 12px; font-weight: 600; color: #aab8cd; cursor: pointer; transition: background 160ms, color 160ms, border-color 160ms; }
    .format-toggle label:hover span { color: #fff; background: #ffffff08; }
    .format-toggle input:checked + span { color: #e5faff; border-color: #b2e9ff35; background: linear-gradient(135deg, #ace6ff24, #b7a2ff18); box-shadow: inset 0 1px 0 #ffffff20, 0 2px 8px #00000020; }
    .format-toggle input:focus-visible + span, button:focus-visible { outline: 2px solid #a1eaff; outline-offset: 3px; }
    .format-hint { font-size: 11px; line-height: 1.6; color: #9caec7; margin: 10px 2px 0; }
    .actions { display: grid; gap: 8px; padding-top: 16px; border-top: 1px solid #ffffff12; }
    button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 13px; border: 1px solid #ffffff20; border-radius: 11px; background: linear-gradient(120deg, #ffffff0d, #ffffff04); box-shadow: inset 0 1px 0 #ffffff0d; color: #dce7f7; cursor: pointer; font: inherit; font-size: 12px; font-weight: 550; text-align: left; transition: background 160ms, border-color 160ms, transform 160ms; }
    button svg { width: 16px; height: 16px; color: #b5c7df; flex-shrink: 0; }
    button:hover { border-color: #c2eaff60; background: #ffffff15; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    #pick-element { color: #122334; background: linear-gradient(115deg, #b9f0f4, #c8d5ff); border-color: #d2f7ff; box-shadow: inset 0 1px 0 #ffffff90, 0 4px 20px #95dfff18; }
    #pick-element svg { color: #263d53; }
    #pick-element:hover { background: linear-gradient(115deg, #d1fbff, #dbdfff); }
    button:disabled { opacity: 0.45; cursor: wait; transform: none; }
    .status { font-size: 11px; line-height: 1.6; color: #c0d4e9; text-align: center; overflow-wrap: anywhere; }
    .status:not(:empty) { margin-top: 14px; }
    .status.working::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -2px; border: 2px solid #ffffff20; border-top-color: #b9f0f4; border-radius: 50%; animation: spin 700ms linear infinite; }
    /* Matte stealth surfaces with a restrained gold canopy accent. */
    body { padding: 10px; background: #0d1112; }
    .shell { padding: 12px; border: 1px solid #3b4042; border-radius: 3px; background: #171b1d; box-shadow: none; backdrop-filter: none; }
    .shell::before { left: 12px; right: auto; width: 32px; background: #c3a16a; }
    header { gap: 9px; margin-bottom: 14px; }
    .mark { width: 32px; height: 32px; border: 1px solid #44463d; border-radius: 2px; color: #c3a16a; background: #202524; box-shadow: none; }
    .mark svg { width: 23px; height: 23px; }
    h3 { font-size: 21px; font-weight: 500; letter-spacing: 0; color: #e3e5e3; }
    .spark { width: 9px; height: 3px; border-radius: 0; background: #c3a16a; box-shadow: none; }
    legend, .subtitle { color: #999f9e; }
    fieldset { margin-bottom: 10px; }
    legend { margin-bottom: 5px; }
    .format-toggle { padding: 1px; gap: 2px; border: 1px solid #303638; border-radius: 2px; background: #101415; box-shadow: none; }
    .format-toggle span { padding: 6px 0; border-radius: 1px; font-weight: 500; color: #a5abaa; }
    .format-toggle label:hover span { color: #e9ece8; background: #242a2b; }
    .format-toggle input:checked + span { color: #e3c68f; border-color: #77613d; background: #342f24; box-shadow: none; }
    .format-toggle input:focus-visible + span, button:focus-visible { outline-color: #c3a16a; }
    .format-hint { margin-top: 6px; line-height: 1.4; color: #999f9e; }
    .actions { padding: 1px; gap: 5px; border-top-color: #303638; }
    button { padding: 8px 10px; border: 1px solid #3b4243; border-radius: 2px; color: #d2d7d4; font-weight: 500; background: #242a2b; box-shadow: none; transition: background 140ms, border-color 140ms; }
    button svg { color: #9da7a4; }
    button:hover { border-color: #616963; background: #303738; transform: none; }
    button:active { background: #171d1e; transform: none; box-shadow: none; }
    #pick-element { color: #191b19; border-color: #c3a16a; background: #c3a16a; box-shadow: none; }
    #pick-element svg { color: #303126; }
    #pick-element:hover { background: #d4b67f; border-color: #d4b67f; }
    #pick-element:active { background: #ad8c55; border-color: #ad8c55; }
    .status { color: #bec6c0; }
    .status.working::before { border-top-color: #c3a16a; }
    /* Open-ended attitude display; only its backdrop fades, never its controls. */
    body { background: #0d1112; }
    .shell { isolation: isolate; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .shell::before { inset: 0; width: auto; height: auto; z-index: -1; background: linear-gradient(90deg, transparent, #171f21 12% 88%, transparent); }
    .shell::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, #91b9ab60 25% 75%, transparent); pointer-events: none; }
    .mark { width: 34px; height: 34px; border: 0; background: transparent; color: oklch(83.7% 0.128 66.29); }
    .mark svg { width: 32px; height: 32px; stroke-width: 1; }
    .spark { background: oklch(83.7% 0.128 66.29); }
    legend, .subtitle { color: #96aaa2; }
    .format-toggle { border: 0; background: transparent; }
    .format-toggle span { border-radius: 2px; color: #a5b6af; }
    .format-toggle label:hover span { color: #e4f4ed; background: oklch(83.7% 0.128 66.29 / 0.05); }
    .format-toggle input:checked + span { color: oklch(83.7% 0.128 66.29); background: oklch(83.7% 0.128 66.29 / 0.05); border-color: transparent; border-bottom-color: oklch(83.7% 0.128 66.29); }
    .format-toggle input:focus-visible + span, button:focus-visible { outline-color: oklch(83.7% 0.128 66.29); }
    .actions { border-top-color: #91b9ab30; }
    button { border-color: #91b9ab30; border-radius: 2px; color: #cce4d8; background: transparent; }
    button svg { color: oklch(83.7% 0.128 66.29); }
    button:hover { border-color: oklch(83.7% 0.128 66.29); background: oklch(83.7% 0.128 66.29 / 0.09); }
    #pick-element { color: oklch(83.7% 0.128 66.29); border-color: #91b9ab80; background: oklch(83.7% 0.128 66.29 / 0.05); }
    #pick-element svg { color: oklch(83.7% 0.128 66.29); }
    #pick-element:hover { background: oklch(83.7% 0.128 66.29 / 0.09); border-color: oklch(83.7% 0.128 66.29); }
    #pick-element:active, button:active { background: oklch(83.7% 0.128 66.29 / 0.16); }
    .status.working::before { border-top-color: oklch(83.7% 0.128 66.29); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
  <header>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 3h6M7 7h10M1 12h7l2 2h4l2-2h7M7 18h10M9 22h6M12 1v2"/></svg></div>
    <div><h3>Plastic</h3><p class="subtitle">Capture. Create.</p></div>
    <span class="spark" aria-hidden="true"></span>
  </header>
  <fieldset>
    <legend>Copy as</legend>
    <div class="format-toggle" role="radiogroup" aria-label="Copy as">
      <label><input type="radio" name="plastic-mode" value="html" checked><span>HTML</span></label>
      <label><input type="radio" name="plastic-mode" value="code"><span>Code</span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>HTML style</legend>
    <div class="format-toggle" role="radiogroup" aria-label="HTML style">
      <label><input type="radio" name="plastic-style" value="css" checked><span>CSS</span></label>
      <label><input type="radio" name="plastic-style" value="tailwind"><span>Tailwind</span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Code format</legend>
    <div class="format-toggle" role="radiogroup" aria-label="Code format">
      <label><input type="radio" name="plastic-code" value="btsx" checked><span>BTSX</span></label>
      <label><input type="radio" name="plastic-code" value="tsrx"><span>TSRX</span></label>
    </div>
    <p class="format-hint">Code sends captured HTML to the Beast converter. Tailwind output needs Tailwind in the destination.</p>
  </fieldset>
  <div class="actions">
    <button id="pick-element"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M9 9l3 9 2-4 4-2-9-3Z"/></svg>Pick Element to Copy</button>
    <button id="copy-page"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Copy Entire Page</button>
    <button id="copy-selection"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16M12 5v14M8 19h8M4 10V5m16 5V5"/></svg>Copy Selected Text</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
